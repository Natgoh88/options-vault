[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 10000

[fmt]
line_length = 100
tab_width = 4
